<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="description" content="A private space for English teachers to explore who they are as educators, through six stations that build one personal landscape. Nothing is graded or measured.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141a45'/%3E%3Ccircle cx='20' cy='11' r='6' fill='%23ffe9a8'/%3E%3Cpath d='M3 24c6-6 10 2 15-2s8-4 11-1' fill='none' stroke='%2362d6c8' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Personal Teaching Atlas</title>
<script>/* apply the saved look before the page paints */ try { document.documentElement.dataset.theme = localStorage.pta_theme === 'paper' ? 'paper' : 'twilight'; } catch (e) { document.documentElement.dataset.theme = 'twilight'; }</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Source+Sans+3:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0e1236; --indigo:#141a45; --dusk:#262a68; --plum:#6a4a8c;
  --teal:#62d6c8; --amber:#ffcf70;
  --text:#efeaff; --muted:#c9c3ec; --faint:#a29dcf;
  --glass:rgba(26,30,82,.58); --glass-strong:rgba(22,26,70,.94);
  --line:rgba(239,234,255,.14); --line-strong:rgba(239,234,255,.3);
  --field:rgba(9,12,38,.6); --err:#ffb8c4;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Source Sans 3","Source Sans Pro",system-ui,sans-serif;
  --ease:cubic-bezier(.3,.7,.2,1);
}
:root{color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:80px}
body{margin:0;min-height:100vh;color:var(--text);font:1.0625rem/1.6 var(--body);
  background:linear-gradient(180deg,var(--night) 0%,var(--indigo) 30%,var(--dusk) 72%,#3d3578 100%) fixed;-webkit-font-smoothing:antialiased}
.sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

h1,h2,h3{font-family:var(--display);font-weight:500;color:#fff;line-height:1.15;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(2rem,1.4rem + 2.6vw,3rem);font-variation-settings:"opsz" 120}
h2{font-size:1.5rem;font-variation-settings:"opsz" 40}
h3{font-size:1.15rem;font-variation-settings:"opsz" 24}
h1:focus{outline:none}
p{margin:0}
a{color:var(--teal)}
small,.hint{color:var(--faint);font-size:.9rem}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 1rem/1.2 var(--body);cursor:pointer;text-decoration:none;
  border:0;padding:11px 22px;border-radius:999px;color:#2a1b00;background:linear-gradient(#ffe29e,#ffbd63);
  box-shadow:0 0 20px rgba(255,207,112,.28),0 3px 0 #b87a22;transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
.btn:hover{box-shadow:0 0 28px rgba(255,207,112,.5),0 3px 0 #b87a22}
.btn:active{transform:translateY(3px);box-shadow:0 0 12px rgba(255,207,112,.3),0 0 0 #b87a22}
.btn.pri{color:#04302b;background:linear-gradient(#97f2e6,#3dbcaf);box-shadow:0 0 20px rgba(98,214,200,.3),0 3px 0 #1d7d74}
.btn.pri:hover{box-shadow:0 0 30px rgba(98,214,200,.55),0 3px 0 #1d7d74}
.btn.pri:active{box-shadow:0 0 12px rgba(98,214,200,.3),0 0 0 #1d7d74}
.btn.ghost{color:var(--text);background:rgba(239,234,255,.06);box-shadow:inset 0 0 0 1px var(--line-strong)}
.btn.ghost:hover{background:rgba(239,234,255,.12)}
.btn.ghost:active{transform:translateY(1px)}
.btn.danger{color:var(--err)}
.btn.sm{padding:7px 16px;font-size:.92rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.link{font:inherit;font-weight:700;color:var(--teal);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:600;padding:6px 2px}
.back:hover{color:#fff}

/* ---- fields ---- */
label,legend{display:block;margin:18px 0 6px;font-weight:700}
label .hint,legend .hint{font-weight:400;margin-left:4px}
input,textarea{font:inherit;width:100%;color:#fff;padding:11px 16px;border:1px solid var(--line-strong);border-radius:14px;background:var(--field)}
textarea{line-height:1.65;resize:vertical;min-height:6em}
input:focus,textarea:focus{border-color:var(--teal)}
input:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:1px}
::placeholder{color:#8f8abd}
.err{color:var(--err);font-weight:600;min-height:1.6em;margin-top:12px}
.err:empty{min-height:0;margin:0}

/* ---- header ---- */
.bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px clamp(16px,3vw,32px);
  background:rgba(12,15,46,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font:500 1.12rem var(--display);font-variation-settings:"opsz" 24}
.bar-r{display:flex;align-items:center;gap:14px;min-width:0}
.who{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.saved{font-size:.9rem;color:var(--faint);white-space:nowrap}
.saved.ok::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-right:7px;vertical-align:middle;box-shadow:0 0 8px var(--teal)}
.saved.bad{color:var(--err);white-space:normal;max-width:40ch}

/* ---- page shell ---- */
main{max-width:1040px;margin:28px auto 64px;padding:clamp(22px,4vw,44px);
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:30px;box-shadow:0 30px 80px rgba(3,5,25,.45),inset 0 1px 0 rgba(255,255,255,.12)}
.lede{color:var(--muted);max-width:62ch;margin-top:12px;font-size:1.1rem}
.banner{background:rgba(255,184,196,.1);border:1px solid rgba(255,184,196,.45);border-radius:16px;padding:14px 18px;margin-bottom:22px}

/* ---- auth ---- */
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px 18vh}
.auth{width:100%;max-width:460px;margin:0}
.auth h1{font-size:clamp(2rem,1.6rem + 2vw,2.6rem)}
.auth .lede{font-size:1.02rem}
.auth form{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.auth .btn.pri{width:100%;margin-top:10px}
.switch{margin-top:18px;color:var(--muted);text-align:center}
.note{margin-top:22px;color:var(--faint);font-size:.9rem;text-align:center}
.mark{display:block;margin-bottom:18px}

/* ---- home ---- */
.home-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(24px,4vw,48px);margin-top:34px;align-items:start}
.trail{list-style:none;margin:0;padding:0;position:relative}
.trail li{position:relative;display:grid;grid-template-columns:52px 1fr auto;gap:16px;align-items:center;padding:14px 16px 14px 12px;border-radius:22px}
.trail li+li{margin-top:6px}
.trail li:not(:last-child)::after{content:"";position:absolute;left:37px;top:66px;bottom:-14px;border-left:2px dotted rgba(239,234,255,.28)}
.trail .orb{width:46px;height:46px;border-radius:50%;justify-self:center;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.75),transparent 46%),var(--c);box-shadow:0 0 22px var(--c),inset 0 -6px 10px rgba(0,0,0,.25)}
.trail .closed .orb{width:30px;height:30px;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.35),transparent 50%),var(--c);box-shadow:0 0 0 4px rgba(14,18,54,.9),0 0 0 5px var(--c);opacity:.7}
.trail .open{background:rgba(98,214,200,.08);box-shadow:inset 0 0 0 1px rgba(98,214,200,.35)}
.trail h3{font-size:1.18rem}
.trail p{color:var(--muted);font-size:.98rem}
.trail .closed h3{color:var(--muted)}
.trail .later{color:var(--faint);font-size:.9rem;white-space:nowrap}
.window{display:block;text-decoration:none;color:inherit;border-radius:24px;overflow:hidden;border:1px solid var(--line-strong);background:#173b4a;box-shadow:0 0 50px rgba(106,74,140,.45);transition:box-shadow .2s var(--ease)}
.window:hover{box-shadow:0 0 60px rgba(98,214,200,.35)}
.window svg{display:block;width:100%;height:auto}
.window-cap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;background:rgba(12,15,46,.85);border-top:1px solid var(--line)}
.window-cap b{font:500 1.15rem var(--display);color:#fff}
.window-cap span{color:var(--teal);font-weight:600}
.aside-note{margin-top:16px;color:var(--faint);font-size:.95rem}
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px clamp(24px,4vw,48px);margin-top:44px;padding-top:34px;border-top:1px solid var(--line)}
.about-lead p{margin-top:12px;color:var(--muted);max-width:52ch}
.about-list{list-style:none;margin:0;padding:0}
.about-list li{display:grid;grid-template-columns:22px 1fr;gap:14px;align-items:start;color:var(--muted)}
.about-list li+li{margin-top:16px}
.about-list svg{margin-top:2px;opacity:.85}
.about-credit{grid-column:1/-1;color:var(--faint);font-size:.92rem}
@media (max-width:820px){ .about{grid-template-columns:1fr} }

/* ---- station ---- */
.st-head{display:flex;align-items:center;gap:18px;margin-top:18px}
.st-head .orb{flex:none;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.75),transparent 46%),var(--c);box-shadow:0 0 26px var(--c)}
.st-head p{color:var(--muted);font-weight:600}
.prompt{margin:26px 0 14px;max-width:44ch;font:400 clamp(1.25rem,1.1rem + .7vw,1.55rem)/1.4 var(--display);font-variation-settings:"opsz" 30;color:#fff;
  padding-left:20px;border-left:3px solid var(--amber)}
.how{color:var(--muted);max-width:68ch}
.tools{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;margin:26px 0 16px}

.switch-btn{display:inline-flex;align-items:center;gap:12px;font:600 1rem var(--body);color:var(--text);background:none;border:0;padding:6px 4px;cursor:pointer}
.switch-btn .track{position:relative;width:46px;height:26px;border-radius:999px;background:rgba(239,234,255,.14);box-shadow:inset 0 0 0 1px var(--line-strong);transition:background .2s}
.switch-btn .track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#d8d2f5;transition:transform .2s var(--ease)}
.switch-btn[aria-checked=true] .track{background:rgba(98,214,200,.5)}
.switch-btn[aria-checked=true] .track::after{transform:translateX(20px);background:#fff}
.switch-btn .state{color:var(--faint);font-weight:400;font-size:.92rem}
.compass{display:grid;grid-template-columns:auto 1fr;gap:4px 22px;background:rgba(98,214,200,.08);border:1px solid rgba(98,214,200,.4);border-radius:22px;padding:20px 24px;margin:0 0 20px}
.compass[hidden]{display:none}
.compass svg{grid-row:span 3}
.compass p{color:var(--muted);margin:4px 0 6px;max-width:70ch}
.compass ul{margin:4px 0 0;padding-left:1.2em;max-width:70ch}
.compass li+li{margin-top:6px}

.scene{overflow-x:auto;border:1px solid var(--line-strong);border-radius:26px;background:#173b4a;box-shadow:0 0 60px rgba(106,74,140,.4);scrollbar-color:#62d6c855 transparent}
.scene svg{display:block;height:auto;min-width:860px;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:14px 4px 0;color:var(--muted);font-size:.95rem;list-style:none;padding:0}
.legend li{display:inline-flex;align-items:center;gap:7px}
.legend .tip{margin-left:auto;color:var(--faint)}

.nd{cursor:pointer;outline:none}
.nd .ring{opacity:0;transition:opacity .15s}
.nd:hover .ring,.nd:focus-visible .ring{opacity:1}

.dots{margin-top:40px;padding-top:30px;border-top:1px solid var(--line)}
.dots .stem{margin:10px 0 0;color:var(--muted);max-width:64ch}
.dots textarea{margin-top:12px;font-size:1.08rem;background:rgba(9,12,38,.72)}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:28px}

/* ---- station 2: beliefs ---- */
.tools.end{justify-content:flex-end}
.step{margin-top:46px}
.step-h{display:flex;align-items:center;gap:14px}
.step-n{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font:600 1.05rem var(--display);color:#2a1b00;background:linear-gradient(#ffe29e,#ffbd63);box-shadow:0 0 16px rgba(255,207,112,.3)}
.step .how{margin-top:12px}
.step textarea{margin-top:14px}
.opt{font:400 .95rem var(--body);color:var(--faint);margin-left:4px}
.add-row{display:flex;gap:10px;margin-top:14px;align-items:stretch}
.add-row input{flex:1;min-width:0}
.tray{margin-top:18px;border:1px dashed var(--line-strong);border-radius:20px;padding:14px 16px;background:rgba(9,12,38,.35)}
.tray h3{font:700 .98rem var(--body);color:var(--muted)}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.zone{position:relative;overflow:hidden;min-height:240px;border-radius:22px;border:1px solid var(--line-strong);padding:14px;background:var(--zbg)}
.zone .art{position:absolute;left:0;right:0;bottom:0;width:100%;height:70%;pointer-events:none}
.zone-h{position:relative;display:flex;gap:10px;align-items:center;padding:8px 14px 8px 8px;border-radius:14px;background:rgba(12,15,46,.8);width:fit-content;max-width:100%}
.zone-h svg{flex:none}
.zone-h h3{font-size:1.08rem}
.zone-h p{font-size:.9rem;color:var(--muted);line-height:1.3}
.cards{position:relative;display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;min-height:44px;align-content:flex-start}
.bcard{font:inherit;font-size:.98rem;line-height:1.35;text-align:left;color:var(--text);background:rgba(12,15,46,.94);border:1px solid var(--line-strong);border-radius:14px;padding:9px 13px;max-width:100%;cursor:grab;user-select:none;-webkit-user-select:none;display:inline-flex;gap:8px;align-items:flex-start;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.bcard:hover{border-color:var(--amber)}
.bcard.prov{border-style:dashed}
.bcard svg{flex:none;margin-top:2px}
.bcard.lifted{opacity:.3}
.zone.over,.tray.over{outline:3px dashed var(--teal);outline-offset:-4px}
.drag-ghost{position:fixed;z-index:50;pointer-events:none;margin:0;transform:rotate(-2deg);box-shadow:0 18px 40px rgba(0,0,0,.55);border-color:var(--amber)}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none!important}
.empty-z{color:var(--faint);font-size:.95rem;padding:4px 2px}
.provs{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.provs li{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 14px 12px 18px;border-radius:16px;background:rgba(239,234,255,.05);border:1px solid var(--line)}
.provs .in{color:var(--teal);font-weight:600;white-space:nowrap;font-size:.95rem}
.picks{border:0;padding:0;margin:16px 0 0;min-width:0}
.picks legend{margin:0 0 8px}
.pick{display:flex;gap:12px;align-items:flex-start;font-weight:400;margin:0;padding:8px 12px;border-radius:12px;cursor:pointer}
.pick:hover{background:rgba(239,234,255,.05)}
.pick input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--amber);flex:none}
.pick.off{opacity:.5;cursor:not-allowed}
.close-read{margin-top:18px;padding:20px 22px;border-radius:20px;background:rgba(9,12,38,.45);border:1px solid var(--line)}
.close-read blockquote{margin:0;font:400 1.25rem/1.4 var(--display);font-variation-settings:"opsz" 30;color:#fff}
.close-read .chips{margin-top:10px}
details.help{margin-top:18px;color:var(--muted)}
details.help summary{cursor:pointer;font-weight:700;color:var(--text)}
details.help ul{margin:10px 0 0;padding-left:1.2em}
.terr-opts{display:flex;flex-direction:column;gap:6px}
.terr-opts .tone>span{width:100%;border-radius:16px;padding:7px 14px 7px 7px;gap:12px}
.terr-opts .tone>span>span{display:block;line-height:1.3}
.pick.off{opacity:.6}
.terr-opts small{display:block;color:var(--faint);font-weight:400}

/* ---- station 3: practices ---- */
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:0 16px}
.plan-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 14px}
.pt-h{font-weight:700;color:var(--muted);font-size:.92rem;margin-right:2px}
.pt-h:not(:first-child){margin-left:14px}
.scene.plan svg{min-width:640px}
.fig{cursor:grab;touch-action:none}
.fig.dragging{cursor:grabbing}
.plan-hint{margin-top:10px}
.sub{margin-top:28px;font-size:1.15rem}
.people{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.person-row{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;width:100%;text-align:left;font:inherit;color:var(--text);background:rgba(239,234,255,.05);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer}
.person-row:hover{background:rgba(239,234,255,.1)}
.person-row b{margin-right:8px}
.person-row .k{color:var(--faint);font-size:.9rem}
.person-row p{color:var(--muted);font-size:.96rem;margin-top:4px}
.person-row .lab{font-weight:700;color:var(--text)}
.also{margin-top:14px;color:var(--muted)}
.photo-row{margin-top:24px}
.phases{list-style:none;padding:0;margin:18px 0 0}
.phases li{position:relative;padding-left:34px}
.phases li+li{margin-top:24px}
.phases li::before{content:"";position:absolute;left:5px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px rgba(255,207,112,.5)}
.phases li:not(:last-child)::after{content:"";position:absolute;left:11px;top:28px;bottom:-22px;border-left:2px dotted var(--line-strong)}
.phases h3{font-size:1.15rem}
.phases .how{margin-top:4px}
.phases textarea{margin-top:10px}
h3.ph{font-size:1rem;margin-top:18px;color:var(--muted)}
/* ---- station 4: relationships ---- */
.sel{font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line-strong);border-radius:14px;padding:10px 14px;width:min(100%,360px)}
.sel option{background:#1b2152;color:#efeaff}
.sel:focus-visible{outline:3px solid var(--teal);outline-offset:1px}
#field .fig{cursor:grab}
/* ---- station 5: possibilities (both paths always share one style) ---- */
.seed{margin:16px 0 0;padding:14px 18px;border-left:3px solid var(--teal);font:400 1.15rem/1.4 var(--display);color:var(--text);background:rgba(239,234,255,.05);border-radius:0 14px 14px 0}
.scene.map{margin-top:18px}
.scene.map svg{min-width:0}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.path{padding:18px 20px 16px;border-radius:22px;background:rgba(9,12,38,.4);border:1px solid var(--line-strong)}
.path h3{font-size:1.2rem}
.path .how{margin-top:4px}
.path textarea{min-height:7em}
.along{font:700 1rem var(--body);margin:20px 0 8px;color:var(--text)}
.wps{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.wps li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;background:rgba(239,234,255,.05);border:1px solid var(--line)}
.wps li b{font-weight:700;margin-right:4px}
.wp-acts{display:flex;gap:4px}
.wp-acts .btn{padding:4px 9px}
.wp-add{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px;align-items:center}
.wp-add .sel{grid-column:1/-1;width:100%;padding:9px 10px;font-size:.95rem}
.wp-list{margin:6px 0 0;padding-left:1.2em;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:60;display:flex;gap:16px;align-items:center;padding:12px 18px;border-radius:999px;background:var(--glass-strong);border:1px solid var(--line-strong);box-shadow:0 12px 40px rgba(0,0,0,.5);transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
@media (max-width:820px){ .paths{grid-template-columns:1fr} }
/* ---- station 6: becoming ---- */
.scene.weave{margin-top:18px}
.scene.weave svg{min-width:0}
.th-form{margin-top:18px;padding:18px 20px;border-radius:22px;background:rgba(9,12,38,.4);border:1px solid var(--line-strong)}
.th-form .two label{margin-top:0}
.th-form .terr-opts{flex-direction:row;flex-wrap:wrap}
.th-form .btn{margin-top:14px}
.threads-list li{grid-template-columns:26px 1fr auto}
.threads-list li:focus{outline:3px solid var(--teal);outline-offset:2px}
.threads-list .k,.letter-aside .k{color:var(--faint);font-size:.9rem}
.letter-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:22px;margin-top:16px;align-items:start}
/* the letter is a calm, high-contrast sheet in both looks */
.letter textarea{min-height:26em;margin:0;padding:28px 30px;background:#fbf7ee;color:#221c3a;border:1px solid #d9d0bd;border-radius:16px;font:400 1.12rem/1.85 "Fraunces",Georgia,serif;font-variation-settings:"opsz" 14;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.letter textarea::placeholder{color:#8a8070}
.letter textarea:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.letter-aside h3{font-size:1.05rem}
.letter-aside ul{margin:8px 0 0;padding-left:1.2em;color:var(--muted)}
.letter-aside li+li{margin-top:4px}
.reread{margin-top:12px;color:var(--muted);white-space:pre-wrap}
@media (max-width:820px){ .letter-grid{grid-template-columns:1fr} }
/* ---- patchwork quilt ---- */
.navq{display:inline-flex;align-items:center;gap:7px;color:var(--muted);text-decoration:none;font-weight:600;padding:6px 10px;border-radius:999px}
.navq:hover,.navq[aria-current=page]{color:#fff;background:rgba(239,234,255,.1)}
.land-acts{display:flex;flex-wrap:wrap;gap:10px}
.note-box{margin-top:18px;padding:14px 18px;border-radius:18px;background:rgba(98,214,200,.08);border:1px solid rgba(98,214,200,.35);color:var(--text)}
.my-patch{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.my-patch .acts{display:flex;flex-wrap:wrap;gap:8px}
.byline{margin-top:8px;color:var(--faint);font-size:.95rem}
.share-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;margin-top:22px;align-items:start}
.share-quick{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.share-st{border:1px solid var(--line-strong);border-radius:18px;padding:12px 16px;margin:0 0 10px;background:rgba(9,12,38,.35)}
.share-st[disabled]{opacity:.6}
.share-st .check{margin:0}
.share-st .check.top>span{display:flex;flex-direction:column}
.share-st .check.top .hint{margin:2px 0 0;font-weight:400}
.share-st .subs{display:grid;gap:4px;margin:8px 0 2px 32px}
.share-st .check.sub{font-weight:400}
.share-st .check.sub input{width:18px;height:18px}
.share-st input:disabled+span{opacity:.55}
.share-prev{position:sticky;top:84px}
.share-prev h2{font-size:1.2rem;margin-bottom:10px}
.scene.prev svg{min-width:0}
.share-foot{justify-content:flex-start}
.share-foot .spacer{flex:1}
.quilt{list-style:none;margin:24px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));grid-auto-rows:170px;grid-auto-flow:dense;gap:6px}
.patch{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.patch.w2{grid-column:span 2}.patch.h2{grid-row:span 2}
.patch a{position:absolute;inset:0;display:block;color:inherit;text-decoration:none}
.patch .fabric{position:absolute;inset:0;width:100%;height:100%;display:block}
.patch .win{position:absolute;inset:14% 14% 40% 14%;border-radius:8px;overflow:hidden;box-shadow:0 0 0 3px rgba(255,250,240,.9),0 6px 14px rgba(0,0,0,.35)}
.patch:not(.w2):not(.h2) .win{display:none}
.patch.h2:not(.w2) .win{inset:12% 14% 34% 14%}
.patch.w2:not(.h2) .win{inset:14% 30% 42% 30%}
.patch.w2.h2 .win{inset:12% 18% 30% 18%}
.patch .win svg{display:block;width:100%;height:100%}
.patch a::after{content:"";position:absolute;inset:7px;border:2px dashed rgba(255,250,240,.75);border-radius:6px;pointer-events:none}
.patch a:focus-visible{outline:none}
.patch a:focus-visible::after,.patch a:hover::after{border-color:#fff;border-style:solid}
.patch .tag{position:absolute;left:16px;right:16px;bottom:16px;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center;padding:8px 12px;border-radius:12px;background:rgba(12,15,46,.88);color:var(--text);font-size:.9rem;line-height:1.3}
.patch .tag b{flex-basis:100%;font:600 .98rem var(--display);color:#fff}
.patch .tag .by{color:var(--muted)}
.patch .tag .cc{display:inline-flex;gap:4px;align-items:center;color:var(--muted)}
.fabric-band{position:relative;height:56px;border-radius:14px;overflow:hidden;margin:18px 0 0;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.fabric-band .fabric,.swatch .fabric{position:absolute;inset:0;width:100%;height:100%}
.fabric-band::after,.swatch::after{content:"";position:absolute;inset:6px;border:2px dashed rgba(255,250,240,.8);border-radius:9px;pointer-events:none}
.fabric-note{margin-top:8px;color:var(--faint);font-size:.92rem;max-width:72ch}
.swatch-row{display:flex;gap:14px;align-items:center;margin-top:16px}
.swatch{position:relative;flex:none;width:86px;height:86px;border-radius:12px;overflow:hidden}
.demo-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.writings{margin-top:34px;padding-top:26px;border-top:1px solid var(--line)}
.writings h3{margin-top:20px;font-size:1.1rem}
.writings .k{color:var(--faint);font-size:.92rem;margin-top:10px}
.letter-read{margin-top:10px;padding:26px 30px;background:#fbf7ee;color:#221c3a;border-radius:16px;font:400 1.1rem/1.85 "Fraunces",Georgia,serif;white-space:pre-wrap;max-width:70ch}
.comments{margin-top:34px;padding-top:26px;border-top:1px solid var(--line);max-width:760px}
.comments h2:focus{outline:none}
.clist{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.clist li{padding:14px 16px;border-radius:16px;background:rgba(239,234,255,.05);border:1px solid var(--line)}
.clist li:focus{outline:3px solid var(--teal);outline-offset:2px}
.c-meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.c-meta span{color:var(--faint);font-size:.9rem}
.c-body p{margin-top:6px;white-space:pre-wrap}
.c-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.c-acts .confirm{flex-basis:100%;font-weight:600}
.cform{margin-top:16px}
.cform .btn{margin-top:10px}
@media (max-width:900px){ .share-grid{grid-template-columns:1fr} .share-prev{position:static} }
@media (max-width:640px){ .navq .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} .quilt{grid-template-columns:repeat(2,1fr);grid-auto-rows:150px} .patch.w2.h2{grid-row:span 2} }
@media (max-width:480px){ .wp-add{grid-template-columns:1fr} .wp-add .sel{max-width:none} .wps li{grid-template-columns:28px 1fr} .wp-acts{grid-column:2} }
@media (max-width:640px){ .two{grid-template-columns:1fr} .pt-h:not(:first-child){margin-left:0;flex-basis:100%} }

/* ---- landscape ---- */
main.wide{max-width:1240px}
.land-head{display:flex;flex-wrap:wrap;gap:16px 24px;justify-content:space-between;align-items:end;margin:14px 0 22px}
.land-head .lede{margin-top:10px}
.scene.land svg{min-width:900px}

/* ---- dialog ---- */
dialog{padding:0;border:1px solid var(--line-strong);border-radius:26px;color:var(--text);background:var(--glass-strong);
  width:min(580px,calc(100% - 32px));max-height:min(92vh,900px);overflow:auto;box-shadow:0 30px 90px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(8,10,34,.72);backdrop-filter:blur(3px)}
dialog[open]{animation:rise .22s var(--ease)}
.dlg{padding:26px clamp(20px,4vw,32px) 28px}
.dlg h2{padding-right:8px}
.dlg-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.dlg-actions .spacer{flex:1}
.dlg-actions .confirm{flex-basis:100%;font-weight:600}
.order{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:20px;color:var(--muted);font-size:.95rem}
.order span{margin-right:4px}
dialog.side{margin:auto 24px auto auto;width:min(420px,calc(100% - 48px))}
dialog.side::backdrop{background:rgba(8,10,34,.25);backdrop-filter:none}
.when{color:var(--muted);margin-top:6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 5px;border-radius:999px;background:rgba(239,234,255,.08);border:1px solid var(--line);font-size:.95rem}
.story{margin-top:18px;white-space:pre-wrap;line-height:1.7}
.photo-prev{display:block;max-width:100%;max-height:320px;margin-top:14px;border-radius:14px;border:1px solid var(--line-strong)}

.tones{border:0;padding:0;margin:0;min-width:0}
.tones .opts{display:flex;flex-wrap:wrap;gap:8px}
.tone{position:relative;margin:0;font-weight:400}
.tone input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.tone>span{display:inline-flex;align-items:center;gap:8px;padding:5px 15px 5px 5px;border-radius:999px;border:1px solid var(--line-strong);background:var(--field)}
.tone input:checked+span{background:rgba(98,214,200,.16);border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal);font-weight:700}
.tone input:focus-visible+span{outline:3px solid #fff;outline-offset:2px}
.check{display:flex;gap:12px;align-items:flex-start;font-weight:700;cursor:pointer}
.check input{width:20px;height:20px;margin:3px 0 0;flex:none;accent-color:var(--teal)}
.file{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.file input:focus-visible+label{outline:3px solid #fff;outline-offset:3px}
.file label{margin:0}

/* ---- motion ---- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.draw .rv{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw 2.4s var(--ease) .2s forwards}
.draw .rv-spark{opacity:0;animation:fade .9s 2.2s forwards}
.draw .nd{opacity:0;animation:fade .6s forwards;animation-delay:calc(.5s + var(--i) * .22s)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .draw .rv{stroke-dashoffset:0}.draw .rv-spark,.draw .nd{opacity:1}
}

/* ---- small screens ---- */
@media (max-width:820px){ .home-grid{grid-template-columns:1fr} }
@media (max-width:640px){
  main{margin:12px 10px 40px;border-radius:24px}
  .saved:not(.bad){display:none}
  .who{max-width:12ch}
  .brand span{font-size:1rem}
  .trail li{grid-template-columns:44px 1fr;padding:12px 10px}
  .trail li>.btn,.trail .later{grid-column:2;justify-self:start}
  .trail li:not(:last-child)::after{left:31px}
  .zones{grid-template-columns:1fr}
  .provs li{flex-direction:column;align-items:flex-start}
  .compass{grid-template-columns:1fr;padding:18px}
  .compass svg{display:none}
  .legend .tip{margin-left:0;flex-basis:100%}
  dialog,dialog.side{margin:auto 0 0;width:100%;max-width:none;max-height:90vh;border-radius:24px 24px 0 0;border-bottom:0}
}
@media (max-width:420px){ .brand span{display:none} .bar .who{display:none} .bar-r{gap:8px} }
.bar .btn{white-space:nowrap}

/* ---- theme switch (both themes) ---- */
.theme-sw{display:inline-flex;gap:2px;border-radius:999px;padding:3px;background:rgba(239,234,255,.06);box-shadow:inset 0 0 0 1px var(--line-strong)}
.theme-sw button{display:inline-flex;align-items:center;gap:6px;font:600 .85rem/1 var(--body);color:var(--muted);background:none;border:0;border-radius:999px;padding:6px 11px;cursor:pointer}
.theme-sw button[aria-pressed=true]{background:rgba(239,234,255,.18);color:#fff}
.auth-top{position:fixed;top:14px;right:16px;z-index:5}
@media (max-width:640px){ .theme-sw .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap} .theme-sw button{padding:6px 8px} }

/* =================== PAPER THEME (see DESIGN.md) =================== */
[data-theme=paper]{
  color-scheme:light;
  --paper:#f6eedd; --card:#fffaf0; --ink:#1e2756; --ink-2:#4b5080; --ink-3:#62668c;
  --primary:#2f5bd3; --accent:#f2a93b; --ok:#1f7a4d;
  --text:var(--ink); --muted:var(--ink-2); --faint:var(--ink-3); --teal:var(--primary); --amber:var(--accent);
  --glass:var(--card); --glass-strong:var(--card); --line:rgba(30,39,86,.18); --line-strong:var(--ink);
  --field:#fffdf8; --err:#b3261e;
  --display:"Bricolage Grotesque","DM Sans",system-ui,sans-serif; --body:"DM Sans",system-ui,sans-serif;
  --cut:4px 4px 0 var(--ink);
  --grain:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .12 0 0 0 0 .15 0 0 0 0 .34 0 0 0 -1 .48'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
}
[data-theme=paper] body{background:var(--grain),var(--paper);font-size:1.0625rem}
[data-theme=paper] h1,[data-theme=paper] h2,[data-theme=paper] h3{color:var(--ink);font-weight:800;letter-spacing:-.02em;font-variation-settings:normal}
[data-theme=paper] h1{font-size:clamp(2rem,1.3rem + 2.8vw,2.75rem);line-height:1.05}
[data-theme=paper] h3{font-weight:700}
[data-theme=paper] :focus-visible{outline:3px solid var(--primary);outline-offset:3px}
[data-theme=paper] h1:focus{outline:none}
[data-theme=paper] ::placeholder{color:#666a8e}
[data-theme=paper] a{color:var(--primary)}

[data-theme=paper] .btn{color:var(--ink);background:var(--accent);border:2.5px solid var(--ink);border-radius:16px;padding:9px 20px;box-shadow:var(--cut);transition:transform .1s,box-shadow .1s}
[data-theme=paper] .btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
[data-theme=paper] .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
[data-theme=paper] .btn.pri{color:#fff;background:var(--primary)}
[data-theme=paper] .btn.pri:hover{box-shadow:5px 5px 0 var(--ink)}
[data-theme=paper] .btn.pri:active{box-shadow:1px 1px 0 var(--ink)}
[data-theme=paper] .btn.ghost{background:var(--card);box-shadow:3px 3px 0 var(--ink)}
[data-theme=paper] .btn.ghost:hover{background:#fff1d6;box-shadow:4px 4px 0 var(--ink)}
[data-theme=paper] .btn.ghost:active{box-shadow:1px 1px 0 var(--ink)}
[data-theme=paper] .btn.sm{padding:5px 13px;border-radius:12px;border-width:2px;box-shadow:2px 2px 0 var(--ink)}
[data-theme=paper] .btn.danger{color:var(--err)}
[data-theme=paper] .btn[disabled]{box-shadow:none;transform:none}
[data-theme=paper] .link{color:var(--primary)}
[data-theme=paper] .back:hover{color:var(--ink)}

[data-theme=paper] input,[data-theme=paper] textarea{color:var(--ink);background:var(--field);border:2.5px solid var(--ink);border-radius:10px}
[data-theme=paper] input:focus,[data-theme=paper] textarea:focus{border-color:var(--primary)}
[data-theme=paper] .check input,[data-theme=paper] .pick input{accent-color:var(--primary)}

[data-theme=paper] .bar{background:var(--ink);border-bottom:0;backdrop-filter:none;-webkit-backdrop-filter:none}
[data-theme=paper] .bar .brand{color:#fff}
[data-theme=paper] .bar .who{color:#e3e1f4}
[data-theme=paper] .bar .saved{color:#cdd1ef}
[data-theme=paper] .bar .saved.ok::before{background:#7fd6a6;box-shadow:none}
[data-theme=paper] .bar .saved.bad{color:#ffc2bd}
[data-theme=paper] .bar .btn.ghost{background:var(--accent);border-color:#fff;box-shadow:2px 2px 0 #fff}
[data-theme=paper] .bar :focus-visible{outline-color:#fff}
[data-theme=paper] .theme-sw{background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}
[data-theme=paper] .theme-sw button{color:var(--ink)}
[data-theme=paper] .theme-sw button[aria-pressed=true]{background:var(--accent);color:var(--ink)}
[data-theme=paper] .bar .theme-sw{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
[data-theme=paper] .bar .theme-sw button{color:#e3e1f4}
[data-theme=paper] .bar .theme-sw button[aria-pressed=true]{color:var(--ink)}
[data-theme=paper] .auth-top .theme-sw{background:var(--card)}

[data-theme=paper] main{background:var(--grain),var(--card);backdrop-filter:none;-webkit-backdrop-filter:none;border:2.5px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink)}
[data-theme=paper] .auth form{border-top:2px dashed var(--line)}
[data-theme=paper] .banner{background:#fde8e6;border:2px solid var(--err)}

[data-theme=paper] .trail li:not(:last-child)::after{border-left:2.5px dashed rgba(30,39,86,.4)}
[data-theme=paper] .trail .orb,[data-theme=paper] .st-head .orb{background:var(--c);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
[data-theme=paper] .trail .closed .orb{background:var(--c);border:2px solid var(--ink);box-shadow:none;opacity:.55}
[data-theme=paper] .trail .open{background:var(--card);border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--c),5px 5px 0 2.5px var(--ink)}
[data-theme=paper] .window{border:2.5px solid var(--ink);background:#bfe0e6;box-shadow:var(--cut)}
[data-theme=paper] .window:hover{box-shadow:6px 6px 0 var(--ink)}
[data-theme=paper] .window-cap{background:var(--card);border-top:2.5px solid var(--ink)}
[data-theme=paper] .window-cap b{color:var(--ink);font-weight:800}
[data-theme=paper] .window-cap span{color:var(--primary);font-weight:700}
[data-theme=paper] .about{border-top:2px dashed var(--line)}

[data-theme=paper] .prompt{color:var(--ink);font-weight:600;font-variation-settings:normal;border-left:5px solid var(--accent)}
[data-theme=paper] .switch-btn .track{background:var(--card);box-shadow:inset 0 0 0 2px var(--ink)}
[data-theme=paper] .switch-btn .track::after{background:var(--ink)}
[data-theme=paper] .switch-btn[aria-checked=true] .track{background:var(--primary)}
[data-theme=paper] .switch-btn[aria-checked=true] .track::after{background:#fff}
[data-theme=paper] .compass{background:#eaf0fd;border:2.5px solid var(--ink);box-shadow:var(--cut);border-radius:20px}
[data-theme=paper] .scene{border:2.5px solid var(--ink);background:#bfe0e6;box-shadow:6px 6px 0 var(--ink);border-radius:22px;scrollbar-color:#1e275666 transparent}
[data-theme=paper] .nd .ring{stroke:var(--ink)}
[data-theme=paper] .dots{border-top:2px dashed var(--line)}
[data-theme=paper] .dots textarea{background:var(--field)}

[data-theme=paper] dialog{background:var(--card);border:2.5px solid var(--ink);box-shadow:8px 8px 0 var(--ink);border-radius:22px}
[data-theme=paper] dialog::backdrop{background:rgba(30,39,86,.42);backdrop-filter:none}
[data-theme=paper] dialog.side::backdrop{background:rgba(30,39,86,.12)}
[data-theme=paper] .dlg-actions{border-top:2px dashed var(--line)}
[data-theme=paper] .chip{background:var(--paper);border:2px solid var(--ink)}
[data-theme=paper] .tone>span{background:var(--field);border:2px solid var(--ink)}
[data-theme=paper] .tone input:checked+span{background:#dfe6fb;border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
[data-theme=paper] .tone input:focus-visible+span{outline-color:var(--primary)}

[data-theme=paper] .step-n{color:var(--ink);background:var(--accent);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);font-weight:800}
[data-theme=paper] .tray{background:rgba(30,39,86,.04);border:2.5px dashed rgba(30,39,86,.55)}
[data-theme=paper] .zone{border:2.5px solid var(--ink);box-shadow:var(--cut)}
[data-theme=paper] .zone[data-zone=solid]{background:#f3dec3}

async function hashPw(pw){

    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch { return 'plain:' + pw; }
}
function friendly(e){

  if (e && e.name === 'QuotaExceededError') return 'This browser’s storage is full, so the last change was not saved. Remove a photo from a moment to free space.';
  if (/invalid login credentials/i.test(m)) return 'The email or password is incorrect. Check both and try again.';
  if (/already registered|already exists/i.test(m)) return 'An account with this email already exists. Sign in instead.';
  if (/password should be at least/i.test(m)) return 'Use a password with at least 6 characters.';
  if (/failed to fetch|networkerror|load failed/i.test(m)) return 'The server could not be reached. Check your connection and try again.';

}

function zoomTo(svg, box, ms, done){

  if (reduced() || ms <= 0) return finish();
  (function f(t){ if (run !== zoomRun) return;
    const k = Math.min(1, (t - t0)/ms), e = k*(2-k); if (k >= 1) return finish();

  setTimeout(finish, ms + 150);

  return v === 'middle' && h === 'center' ? 'in the center of the room' : v === 'middle' ? `in the middle, on the ${h}` : `at the ${v} ${h === 'center' ? 'center' : h}`;
}
function personShape(c, P, dx = 0, dy = 0, s = 1, square = false){

  return `<g transform="translate(${dx} ${dy}) scale(${s})">${P ? `<path d="M-15 20Q-15 1 0 1Q15 1 15 20Z" fill="${INK}" opacity=".25" transform="translate(3 3)"/>` : ''}${body}<circle cy="-11" r="10" fill="${c}" ${st}/></g>`;
}

  if (k === 'student') return personShape(c, P);

  if (k === 'desk') return `<rect x="-28" y="-17" width="56" height="34" rx="4" fill="${fill}" ${st}/>`;
  if (k === 'door') return `<path d="M-20 12V-12H4V12Z" fill="${fill}" ${st}/><path d="M4-12A24 24 0 0 1 28 12" fill="none" ${st} stroke-dasharray="4 4"/>`;
  if (k === 'window') return `<rect x="-36" y="-7" width="72" height="14" fill="${fill}" ${st}/><path d="M-12-7V7M12-7V7" ${st}/>`;
  return `<rect x="-14" y="-4" width="28" height="18" rx="2" fill="${fill}" ${st} transform="rotate(-8)"/><rect x="-12" y="-14" width="26" height="16" rx="2" fill="${fill}" ${st} transform="rotate(6)"/>`;

// thought (cloud) and feeling (heart) bubbles: different shapes, not only different colors
function bubbles(f, P, s = 1){
  const st = P ? `stroke="${INK}" stroke-width="1.8"` : '';
  let o = '';
  if (f.thinks) o += `<g transform="translate(${22*s} ${-34*s}) scale(${s})"><path d="M-9 4a5 5 0 0 1 1-9a6 6 0 0 1 11-2a5 5 0 0 1 6 6a4 4 0 0 1-2 7Z" fill="${P ? '#fffaf0' : '#e4e8ff'}" ${st}/><circle cx="-10" cy="9" r="2.2" fill="${P ? '#fffaf0' : '#e4e8ff'}" ${st}/></g>`;
  if (f.feels) o += `<g transform="translate(${-22*s} ${-34*s}) scale(${s})"><path d="M0 7C-9 1-9-6-4-7C-1-8 0-5 0-4C0-5 1-8 4-7C9-6 9 1 0 7Z" fill="${P ? '#e86a7a' : '#ff9db0'}" ${st}/></g>`;
  return o;
}
function figSVG(f){

  const label = `${name}${person && k !== 'me' ? ` (${FIGS[k].name.toLowerCase()})` : ''}, ${posWords(f.x, f.y)}${f.thinks ? '. Thinking: ' + trunc(f.thinks, 90) : ''}${f.feels ? '. Feeling: ' + trunc(f.feels, 90) : ''}. Select to write about it; arrow keys move it.`;
  const ring = k === 'board' ? '<ellipse class="ring" rx="92" ry="24"' : k === 'window' ? '<ellipse class="ring" rx="48" ry="20"' : `<circle class="ring" r="${person ? 36 : 32}"`;
  return `<g class="nd fig" data-scope="s3" data-act="fig" data-id="${esc(f.id)}" transform="translate(${PX(f.x)} ${PY(f.y)})" tabindex="0" role="button" aria-label="${esc(label)}">
    ${ring} fill="none" stroke="${P ? INK : '#fff'}" stroke-width="3"/>${figBody(f, P)}${person ? bubbles(f, P) : ''}

function planSVG(){
  const P = isPaper(), F = A.s3.figs;

  const room = P
    ? `<rect width="800" height="500" fill="#e9d6b0"/><rect x="20" y="20" width="760" height="460" fill="#f6e7c8"/><path d="${grid}" stroke="${INK}" stroke-opacity=".1" stroke-width="1.5"/><rect x="20" y="20" width="760" height="460" fill="none" stroke="${INK}" stroke-width="7"/>`
    : `<rect width="800" height="500" fill="#121838"/><rect x="20" y="20" width="760" height="460" fill="#1b2152"/><path d="${grid}" stroke="#62d6c8" stroke-opacity=".09"/><rect x="20" y="20" width="760" height="460" fill="none" stroke="#9db4ff" stroke-opacity=".5" stroke-width="5"/>`;

function addFig(k){
  const n = A.s3.figs.length, f = {id:uid8('f'), kind:k, label:'', x:Math.min(90, 38 + (n % 5)*6), y:Math.min(88, 40 + (n % 4)*8), thinks:'', feels:''};
  if (k === 'board') { f.x = 50; f.y = 2; }
  A.s3.figs.push(f); save(); render();
  if (isPerson(f)) figDialog(f.id, true);
  else { focusFig(f.id); announce(`${FIGS[k].name} added ${posWords(f.x, f.y)}. Drag it, or use the arrow keys, to move it.`); }
}
function focusFig(id){ (document.querySelector(`.fig[data-id="${CSS.escape(id)}"]`) || $('#t2'))?.focus(); }
function figDialog(id, isNew){
  const f = A.s3.figs.find(x => x.id === id); if (!f) return;
  draft = {...f};
  const person = isPerson(f), me = f.kind === 'me';
  afterClose = () => focusFig(id);
  openDlg(`<form id="fForm" novalidate>
  <h2 id="dlgTitle">${me ? 'Me, in this class' : person ? (isNew ? 'Someone in the room' : esc(figName(f))) : FIGS[f.kind].name}</h2>
  ${me ? '' : `<label for="fl">${person ? 'A name, or a few words about them' : 'A label'} <span class="hint">Optional</span></label><input id="fl" value="${esc(f.label)}" maxlength="40" autocomplete="off">`}
  ${person && !me ? `<fieldset class="tones"><legend>Who is this?</legend><div class="opts">${['student', 'group', 'other'].map(k => `<label class="tone"><input type="radio" name="fk" value="${k}" ${f.kind === k ? 'checked' : ''}><span>${figIcon(k)}${FIGS[k].name}</span></label>`).join('')}</div>
    ${FIGS.other.hint ? `<p class="hint" style="margin-top:8px">Another person could be ${FIGS.other.hint.toLowerCase()}</p>` : ''}</fieldset>` : ''}
  ${person ? `<label for="ft">${me ? 'What was I thinking?' : 'What do you imagine they were thinking?'}</label><textarea id="ft" rows="3">${esc(f.thinks)}</textarea>
    <label for="ff">${me ? 'What was I feeling?' : 'What do you imagine they were feeling?'}</label><textarea id="ff" rows="3">${esc(f.feels)}</textarea>` : `<p class="how" style="margin-top:14px">Drag it in the room, or use the arrow keys, to place it where it was.</p>`}
  <div class="dlg-actions" id="fActs">${fActs()}</div></form>`);
  ($('#fl') || $('#ft'))?.focus();

function fActs(){ return `<button class="btn pri" type="submit">Save</button><button type="button" class="btn ghost" data-act="close">Cancel</button><span class="spacer"></span><button type="button" class="btn ghost danger" data-act="fdel">Remove from the room</button>`; }
function saveFig(){
  const f = draft && A.s3.figs.find(x => x.id === draft.id); if (!f) return closeDlg();
  if ($('#fl')) f.label = $('#fl').value.trim();
  const k = dlg.querySelector('input[name=fk]:checked'); if (k) f.kind = k.value;
  if ($('#ft')) { f.thinks = $('#ft').value.trim(); f.feels = $('#ff').value.trim(); }
  save(); render(); closeDlg(); announce('Saved.');

function moveFig(id, dx, dy, scope = 's3'){
  const sc = SCOPES[scope], f = sc.list().find(x => x.id === id); if (!f) return;
  f.x = Math.max(0, Math.min(100, f.x + dx)); f.y = Math.max(0, Math.min(100, f.y + dy));

  save(); render(); focusFig(id); announce(`${sc.name(f)}, ${sc.where(f)}.`);

function settlementSVG(W, mode){
  SETMODE = mode;

  if (!(S.name || S.why || S.before || S.during || S.after || people.length)) return mini ? '' : plaque(W/2, y0 + 84, 'Your settlement takes shape in Station 3', 15, false, true);
  const sw = Math.min(W - 200, 980), left = (W - sw)/2, cx = W/2, sb = y0 + 96, lit = !!(S.before || S.during || S.after);
  // houses keep the room's arrangement but step aside so the school and its name stay clear
  const items = people.map((f, i) => {
    const s = (f.kind === 'me' ? 1.1 : .82) + f.y/100*.3; let x = left + f.x/100*sw;
    const clear = f.kind === 'group' ? 150 : 128;
    if (Math.abs(x - cx) < clear) x = cx + (x < cx || (x === cx && i % 2) ? -clear : clear);
    return {f, x, b: y0 + 56 + f.y/100*96, s};

  // spacing pass: houses on the same row move outward (away from the school) until they no longer overlap
  for (let pass = 0; pass < 6; pass++) for (const a of items) for (const o of items) {

    out.x = Math.max(60, Math.min(W - 60, out.x + dir * (need - gap)));
  }
  const paths = items.map(it => `<path d="M${it.x} ${it.b}Q${(it.x + cx)/2} ${Math.max(it.b, sb) + 18} ${cx} ${sb}" fill="none" stroke="${P ? INK : '#c9c3ec'}" stroke-opacity="${P ? .45 : .35}" stroke-width="2.5" stroke-dasharray="3 8" stroke-linecap="round"/>`).join('');
  POS['class:class'] = [cx, sb - 50]; const schoolLabel = `The class: ${S.name || 'a class I remember'}${S.when ? ', ' + S.when : ''}.`;
  const school = {b: sb, draw: () => mini ? schoolSVG(cx, sb, P, lit)
    : `<g class="nd" data-act="node" data-kind="class" data-id="class" data-x="${cx}" data-y="${sb - 50}" tabindex="0" role="button" aria-label="${esc(schoolLabel)}"><ellipse class="ring" cx="${cx}" cy="${sb - 50}" rx="112" ry="78" fill="none" stroke="${P ? INK : '#fff'}" stroke-width="3"/>${schoolSVG(cx, sb, P, lit)}${plaque(cx, sb + 30, trunc(S.name || 'A class I remember', 28), 15, true)}</g>`};
  const houses = items.map(it => ({b: it.b, draw: () => {
    POS['fig:' + it.f.id] = [it.x, it.b - 20*it.s]; const f = it.f, lit2 = !!(f.thinks || f.feels), me = f.kind === 'me';
    const art = f.kind === 'group' ? houseSVG(it.x - 20*it.s, it.b, it.s*.72, f.kind, lit2, P) + houseSVG(it.x + 20*it.s, it.b, it.s*.72, f.kind, lit2, P) + houseSVG(it.x, it.b + 8*it.s, it.s*.72, f.kind, lit2, P)
      : houseSVG(it.x, it.b, it.s, f.kind, lit2, P, me);
    const bub = `<g transform="translate(${it.x} ${it.b - 44*it.s})">${bubbles(f, P, .8)}</g>`;
    if (mini) return art;
    const label = `${figName(f)}${me ? '' : ` (${FIGS[f.kind].name.toLowerCase()})`}, in the class${f.thinks ? '. Thinking: ' + trunc(f.thinks, 90) : ''}${f.feels ? '. Feeling: ' + trunc(f.feels, 90) : ''}.`;
    return `<g class="nd" data-act="node" data-kind="fig" data-id="${esc(f.id)}" data-x="${it.x}" data-y="${it.b - 20*it.s}" tabindex="0" role="button" aria-label="${esc(label)}"><circle class="ring" cx="${it.x}" cy="${it.b - 22*it.s}" r="${34*it.s}" fill="none" stroke="${P ? INK : '#fff'}" stroke-width="3"/>${art}${bub}</g>`;
  }}));
  return `<g>${paths}${[school, ...houses].sort((a, b) => a.b - b.b).map(i => i.draw()).join('')}</g>`;
}

function orderHTML(id){

  return `<div class="order" id="mOrder"><span>Place in the river: ${i + 1} of ${n}</span>

function readImg(file){
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type)) return rej(Error('That file is not an image. Choose a JPEG, PNG or WebP photo.'));
    const i = new Image(), u = URL.createObjectURL(file);
    i.onload = () => { const k = Math.min(1, 640/Math.max(i.width, i.height)), c = document.createElement('canvas');
      c.width = Math.round(i.width*k); c.height = Math.round(i.height*k);
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', .72)); };
    i.onerror = () => { URL.revokeObjectURL(u); rej(Error('This photo could not be opened. Try saving it as a JPEG or PNG first.')); };
    i.src = u;
  });
}
function saveMoment(){
  const r = draft; if (!r) return;

  const orig = A.river.find(x => x.id === r.id);

  const id = r.id; afterClose = () => focusNode(id);
  save(); render(); closeDlg();
}
function move(d){
  const i = A.river.findIndex(x => x.id === draft.id), j = i + d;

  (dlg.querySelector(`[data-act="${d < 0 ? 'earlier' : 'later'}"]:not([disabled])`) || dlg.querySelector('#mOrder button:not([disabled])'))?.focus();
}

  else if (a === 'fdelNo') { $('#fActs').innerHTML = fActs(); $('[data-act="fdel"]').focus(); }
  else if (a === 'fdelYes') { const id = draft.id; A.s3.figs = A.s3.figs.filter(x => x.id !== id); afterClose = () => ($('.fig') || $('[data-act="addFig"]'))?.focus(); save(); render(); closeDlg(); announce('Removed from the room.'); }
  else if (a === 's3noimg') { A.s3.img = ''; save(); render(); $('label[for="s3img"]')?.focus(); }
  else if (a === 'compass') {
    compass = !compass; t.setAttribute('aria-checked', compass); t.querySelector('.state').textContent = compass ? 'On' : 'Off';
    $('#compassBox').hidden = !compass;
  }
  else if (a === 'add') editor();
  else if (a === 'node') {
    const kind = t.dataset.kind, id = t.dataset.id;
    // on someone else's patch, read from their shared data instead of my atlas
    const r = inView(() => kind === 'class' ? {...A.s3, id:'class'} : kind === 'path' ? {...A.s5.paths[+id], id} : kind === 'thread' ? A.s6.threads.find(x => x.id === id) : (kind === 'belief' ? A.s2.cards : kind === 'fig' ? A.s3.figs : kind === 'star' ? A.s4.people : A.river).find(x => x.id === id)); if (!r) return;
    if (view === 's1') return editor(r.id);
    const svg = $('#land'); if (!svg || zoomed) return;
    const [, , W, H] = svg.getAttribute('viewBox').split(' ').map(Number), x = +t.dataset.x, y = +t.dataset.y, wide = innerWidth > 900;
    const sc = svg.parentElement; sc.scrollLeft = (sc.scrollWidth - sc.clientWidth) / 2;
    sc.scrollIntoView({block:'center', behavior: reduced() ? 'auto' : 'smooth'});
    // keep the svg's own aspect ratio so the zoom frames the element instead of filling past it
    const bw = Math.min(W, 640), bh = bw * H / W;
    zoomed = true;
    zoomTo(svg, [x - bw * (wide ? .3 : .5), y - bh * .5, bw, bh], 600, () => inView(() => detail(kind, r, svg, W, H)));
  }
  else if (a === 'close') closeDlg();
  else if (a === 'editHere') { const id = t.dataset.id, v = t.dataset.v; afterClose = null; closeDlg(); pendingEdit = {v, id}; location.hash = v; }
  else if (a === 'bcard') cardDialog(t.dataset.id);
  else if (a === 'addProv') {

    A.s2.cards.push({id:uid8('b'), text:p[1], terrain:'', src:'prov', prov:p[0], pick:false, story:''});
    save(); render(); announce('Added to your cards, under “Not placed yet”.');
    ($(`[data-act="addProv"]`) || $('#st3'))?.focus();
  }
  else if (a === 'bdel') {
    const c = A.s2.cards.find(x => x.id === draft.id);
    $('#bActs').innerHTML = `<p class="confirm">Delete this card?${c && c.story ? ' What you wrote about it will be deleted too.' : ''} This cannot be undone.</p>
      <button type="button" class="btn ghost danger" data-act="bdelYes">Delete card</button><button type="button" class="btn ghost" data-act="bdelNo">Keep it</button>`;
    $('[data-act="bdelNo"]').focus();
  }
  else if (a === 'bdelNo') { $('#bActs').innerHTML = bActs(); $('[data-act="bdel"]').focus(); }
  else if (a === 'bdelYes') { const id = draft.id; A.s2.cards = A.s2.cards.filter(x => x.id !== id); afterClose = () => ($('.bcard') || $('#nb'))?.focus(); save(); render(); closeDlg(); announce('Card deleted.'); }
  else if (a === 'noimg') { draft.img = ''; $('#imgBox').innerHTML = ''; t.hidden = true; $('#miLabel').textContent = 'Choose a photo'; $('#mi').value = ''; $('#miLabel').focus(); }
  else if (a === 'earlier') move(-1);
  else if (a === 'later') move(1);
  else if (a === 'del') {
    $('#mActs').innerHTML = `<p class="confirm">Delete “${esc(draft.title || draft.when)}” from your river? This cannot be undone.</p>
      <button type="button" class="btn ghost danger" data-act="delYes">Delete moment</button><button type="button" class="btn ghost" data-act="delNo">Keep it</button>`;
    $('[data-act="delNo"]').focus();
  }
  else if (a === 'delNo') { $('#mActs').innerHTML = actsHTML(true); $('[data-act="del"]').focus(); }
  else if (a === 'delYes') { const id = draft.id; A.river = A.river.filter(x => x.id !== id); afterClose = () => ($('[data-act="add"]') || $('main h1'))?.focus(); save(); render(); closeDlg(); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('.nd')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', {bubbles:true})); }
  // move a figure in the classroom with the arrow keys (Shift for bigger steps)
  const arrows = {ArrowLeft:[-1, 0], ArrowRight:[1, 0], ArrowUp:[0, -1], ArrowDown:[0, 1]}[e.key];
  if (arrows && e.target.matches?.('.fig')) { e.preventDefault(); const st = e.shiftKey ? 10 : 3; moveFig(e.target.dataset.id, arrows[0]*st, arrows[1]*st, e.target.dataset.scope); }
});
document.addEventListener('input', e => {
  const f = e.target.dataset.field;
  if (f) { const [a, b] = f.split('.'); if (b) A[a][b] = e.target.value; else A[a] = e.target.value; save(); }
  else if (e.target.classList.contains('story')) { const c = A.s2.cards.find(x => x.id === e.target.dataset.id); if (c) { c.story = e.target.value; save(); } }
  else if (e.target.classList.contains('pstory')) { const p = A.s4.people.find(x => x.id === e.target.dataset.id); if (p) { p.story = e.target.value; save(); } }
  else if (e.target.dataset.path) {
    A.s5.paths[+e.target.dataset.path][e.target.dataset.pf] = e.target.value; save();
    if (e.target.dataset.pf === 'title') { const m = $('.scene.map'); if (m) m.innerHTML = pathsMapSVG(); }
  }
  else if (e.target.dataset.seed) { A.s5.seed.text = e.target.value; save(); }
  else if (e.target.dataset.sh && SD) SD[e.target.dataset.sh] = e.target.value;
});
document.addEventListener('change', async e => {
  if (e.target.classList.contains('sharebox') && SD) {
    const k = e.target.dataset.k; SD.c[k] = e.target.checked;
    if (!e.target.dataset.parent) document.querySelectorAll(`.sharebox[data-parent="${k}"]`).forEach(b => { b.disabled = !e.target.checked; });
    refreshShare(); return;
  }
  if (e.target.name === 'shmode' && SD) { SD.mode = e.target.value; const y = scrollY; render(); scrollTo(0, y); (SD.mode === 'alias' ? $('#shalias') : e.target.ownerDocument.querySelector(`input[name=shmode][value="${SD.mode}"]`))?.focus({preventScroll:true}); return; }
  if (e.target.id === 's5seed') {
    const [k, id] = e.target.value.split(':'); A.s5.seed = {k: k || '', id: id || '', text: A.s5.seed.text || ''};
    save(); render(); (k === 'other' ? $('#s5other') : $('#s5seed'))?.focus(); return;
  }
  if (e.target.id === 's4focus') { A.s4.focus = e.target.value; save(); render(); $('#s4focus')?.focus(); announce(A.s4.focus ? 'A space for the encounter is below.' : ''); return; }
  if (e.target.name === 'meet' && e.target.dataset.id) { const p = A.s4.people.find(x => x.id === e.target.dataset.id); if (p) { p.meet = e.target.value; save(); } return; }
  if (e.target.classList.contains('pickbox')) {
    const c = A.s2.cards.find(x => x.id === e.target.dataset.id); if (!c) return;
    if (e.target.checked && A.s2.cards.filter(x => x.pick).length >= 3) { e.target.checked = false; return; }
    c.pick = e.target.checked; save(); render();
    $(`#pick-${CSS.escape(c.id)}`)?.focus();
    announce(c.pick ? 'Chosen. A space to write about it is below.' : 'No longer chosen. What you wrote is kept if you choose it again.');
    return;
  }
  if (e.target.id === 's3img' && e.target.files[0]) {
    try { A.s3.img = await readImg(e.target.files[0]); save(); render(); $('label[for="s3img"]')?.focus(); announce('Image added.'); }
    catch (x) { const er = $('#s3err'); if (er) er.textContent = x.message; }
    return;
  }
  if (e.target.id !== 'mi' || !e.target.files[0] || !draft) return;
  const err = $('#mErr'); err.textContent = '';
  try {
    draft.img = await readImg(e.target.files[0]);
    $('#imgBox').innerHTML = `<img class="photo-prev" src="${draft.img}" alt="Photo for this moment">`;
    $('[data-act="noimg"]').hidden = false; $('#miLabel').textContent = 'Change photo';
  } catch (x) { err.textContent = x.message; }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'mForm') return saveMoment();
  if (e.target.id === 'bForm') return saveCard();
  if (e.target.id === 'fForm') return saveFig();
  if (e.target.id === 'pForm') return savePerson();
  if (e.target.id === 'thForm') return tieThread();
  if (e.target.id === 'shareForm') return publish();
  if (e.target.id === 'cForm') {
    const body = $('#cbody').value.trim(), err = $('#cErr');
    if (!body) { err.textContent = 'Write your question or comment first, then post it.'; $('#cbody').focus(); return; }
    const b = $('#cPost'); b.disabled = true; b.textContent = 'Posting…';
    try { await QS.addComment(QC.patch.id, body); announce('Comment posted.'); await reloadComments('#cbody'); }
    catch (x) { b.disabled = false; b.textContent = 'Post'; err.textContent = 'Your comment was not posted. ' + friendly(x); }
    return;
  }
  if (e.target.classList.contains('cEditForm')) {
    const id = e.target.dataset.id, body = e.target.querySelector('textarea').value.trim(), err = e.target.querySelector('.err');
    if (!body) { err.textContent = 'A comment cannot be empty. Write something, or delete the comment instead.'; e.target.querySelector('textarea').focus(); return; }
    try { await QS.editComment(id, body); announce('Comment saved.'); await reloadComments(`#c-${CSS.escape(id)}`); }
    catch (x) { err.textContent = 'Your changes were not saved. ' + friendly(x); }
    return;
  }
  if (e.target.classList.contains('wp-add')) {
    const i = +e.target.dataset.i, inp = $(`#wpx${i}`), text = inp.value.trim(), t = $(`#wpt${i}`).value;
    if (!text) { $(`#wpErr${i}`).textContent = 'Describe it in a few words, then add it.'; inp.focus(); return; }
    A.s5.paths[i].wps.push({id:uid8('w'), t, text}); save(); render();
    $(`#wpt${i}`).value = t; $(`#wpx${i}`).focus(); announce(`Added to ${pathName(i)}: ${WP[t].short.toLowerCase()}.`);
    return;
  }
  if (e.target.id === 'addB') {
    const inp = $('#nb'), text = inp.value.trim();
    if (!text) { $('#nbErr').textContent = 'Write a belief first, then add the card.'; inp.focus(); return; }
    A.s2.cards.push({id:uid8('b'), text, terrain:'', src:'own', pick:false, story:''});

  busy = true; f.querySelector('[type=submit]').disabled = true; f.querySelector('[type=submit]').textContent = 'One moment…';
  try { await authenticate(mode, name, email, pw); await loadAtlas(); msg = ''; keepEmail = ''; busy = false; render(true); }
  catch (err) { busy = false; msg = friendly(err); keepEmail = email; render(); $('#pw').focus(); }
});

// ---------- drag cards onto the land (mouse and pen; touch and keyboard use the card dialog) ----------
let drag = null;
function zoneAt(x, y){ const el = document.elementFromPoint(x, y); return el && el.closest('[data-zone]'); }
function endDrag(drop){
  if (!drag) return;
  const d = drag; drag = null;
  document.body.classList.remove('dragging');
  d.ghost?.remove(); d.el.classList.remove('lifted');
  document.querySelectorAll('.over').forEach(z => z.classList.remove('over'));
  if (d.on) { suppressClick = true; setTimeout(() => { suppressClick = false; }, 0); }
  if (d.on && drop && d.zone) placeCard(d.id, d.zone.dataset.zone);
}
document.addEventListener('pointerdown', e => {
  const c = e.target.closest('.bcard'); if (!c || e.button !== 0 || e.pointerType === 'touch') return;
  drag = {id:c.dataset.id, el:c, x0:e.clientX, y0:e.clientY, on:false, ghost:null, zone:null};
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.on) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
    const r = drag.el.getBoundingClientRect();
    drag.on = true; drag.dx = drag.x0 - r.left; drag.dy = drag.y0 - r.top;
    drag.ghost = drag.el.cloneNode(true); drag.ghost.classList.add('drag-ghost'); drag.ghost.removeAttribute('data-act'); drag.ghost.setAttribute('aria-hidden', 'true');
    drag.ghost.style.width = r.width + 'px'; document.body.appendChild(drag.ghost);
    drag.el.classList.add('lifted'); document.body.classList.add('dragging'); getSelection()?.removeAllRanges();
  }
  drag.ghost.style.left = (e.clientX - drag.dx) + 'px'; drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
  const z = zoneAt(e.clientX, e.clientY);
  if (z !== drag.zone) { drag.zone?.classList.remove('over'); z?.classList.add('over'); drag.zone = z; }
});
document.addEventListener('pointerup', () => endDrag(true));

// ---------- drag figures in the classroom (mouse, pen and touch) ----------
let figDrag = null;
document.addEventListener('pointerdown', e => {
  const g = e.target.closest('.fig'); if (!g || e.button !== 0) return;
  const sc = SCOPES[g.dataset.scope], f = sc?.list().find(x => x.id === g.dataset.id); if (!f) return;
  figDrag = {g, f, sc, svg:g.ownerSVGElement, x0:e.clientX, y0:e.clientY, moved:false, px:sc.X(f.x), py:sc.Y(f.y)};
  g.setPointerCapture?.(e.pointerId);
});
document.addEventListener('pointermove', e => {
  const d = figDrag; if (!d) return;
  if (!d.moved && Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 5) return;
  d.moved = true; d.g.classList.add('dragging');
  const pt = d.svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(d.svg.getScreenCTM().inverse());
  d.px = Math.max(d.sc.X(0), Math.min(d.sc.X(100), p.x)); d.py = Math.max(d.sc.Y(0), Math.min(d.sc.Y(100), p.y));
  d.g.setAttribute('transform', `translate(${d.px} ${d.py})`);
  if (d.sc.live) d.sc.live(d);
});
function endFigDrag(drop){
  const d = figDrag; figDrag = null; if (!d) return;
  d.g.classList.remove('dragging');
  if (!d.moved) return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  if (!drop) { render(); return; }
  d.f.x = Math.round((d.px - d.sc.X(0)) / d.sc.kx); d.f.y = Math.round((d.py - d.sc.Y(0)) / d.sc.ky);
  d.sc.clamp?.(d.f);
  save(); render(); focusFig(d.f.id); announce(`${d.sc.name(d.f)}, ${d.sc.where(d.f)}.`);
}
document.addEventListener('pointerup', () => endFigDrag(true));
document.addEventListener('pointercancel', () => endFigDrag(false));
document.addEventListener('pointercancel', () => endDrag(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && drag?.on) endDrag(false); });

// ---------- start ----------
(async () => {
  try {
    if (demo) { const em = localStorage.pta_session, u = JSON.parse(localStorage.pta_users || '{}'); if (em && u[em]) user = {id:em, name:u[em].name}; }
    else {
      const m = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
      sb = m.createClient(SUPABASE_URL, SUPABASE_KEY);
      const s = (await sb.auth.getSession()).data.session; if (s) setUser(s.user);
    }
    if (user) await loadAtlas();
  } catch (e) { console.error(e); msg = friendly(e); }
  render();
})();
